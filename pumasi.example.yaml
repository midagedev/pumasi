# Copy to pumasi.yaml, then: make && PUMASI_GITHUB_TOKEN=$(gh auth token) ./dist/pumasi up
url: https://github.com/OWNER/REPO         # repo, org or enterprise
listen: 0.0.0.0:7411                       # where hosts connect (the default); `pumasi invite` prints the line that joins one

classes:                                   # a class is a runner size: runs-on: [self-hosted, pumasi-<name>]
  - {name: small, cpus: 1, memory: 1G}
# - {name: e2e,   cpus: 4, memory: 8G, docker: inside, maxDuration: 2h}   # the job's own docker daemon, inside the limits
# - {name: cache, cpus: 2, memory: 3G, mounts: [/srv/ci-cache]}           # a host path, only on hosts that have it
# - {name: build, cpus: 4, memory: 8G, driver: native, hosts: [server1]}  # a process of the host's user, on that host only
# - {name: deploy, cpus: 2, memory: 4G, reserve: 1}                       # room other classes may not take
# - {name: shared, cpus: 4, memory: 8G, driver: native, labels: [self-hosted, Linux, X64, ci-pool]}  # takes over fixed runners' jobs
# - {name: macos, cpus: 4, memory: 8G, os: macos}                         # os: macos | windows, on hosts of that OS

# hosts:                                   # optional: `up` runs the invite line there over ssh for you
#   - {ssh: server1, budget: {cpus: 4, memory: 6G}}
#   - {ssh: desk1, desktop: true, budget: {cpus: 6, memory: 9G}}          # someone works there: used last, theirs first

# rerun: 1                                 # rerun a run's failed jobs once after a failure on pumasi's side
# notify: {webhook: https://hooks.example/…}   # or command: my-notify --stdin; problems and their end, one line each
# image: ghcr.io/actions/actions-runner:2.338.2   # the runner version; keep a version tag, not :latest
