# Copy to pumasi.yaml, then: make && PUMASI_GITHUB_TOKEN=$(gh auth token) ./dist/pumasi up
url: https://github.com/OWNER/REPO   # repo, org or enterprise

classes:                             # a class is a runner size; jobs pick one with
  - {name: linux-s, cpus: 1, memory: 1G}   #   runs-on: [self-hosted, pumasi-linux-s]
  - {name: linux-l, cpus: 2, memory: 3G}
#  - {name: macos, cpus: 4, memory: 8G, os: macos}   # placed only on macOS hosts, where runners are
#                                                    #   processes of the host's user (see README)

hosts:                               # ssh destinations (aliases from ~/.ssh/config) with Docker
  - ssh: server1
    budget: {cpus: 4, memory: 6G}    # the most pumasi may use on this host
  - ssh: desk1
    desktop: true                    # someone works here: used after the servers
    shell: wsl -e sh -s              # Windows host running WSL (default: sh -s)
    budget: {cpus: 6, memory: 9G}

# listen: 0.0.0.0:7411              # optional: hosts join by themselves instead of (or next to) hosts:
#                                    #   `pumasi invite` prints the line to run on a host

# rerun: 1                           # optional: after a failure on pumasi's side (host reboot, runner killed)
#                                    #   rerun that run's failed jobs once; default 0 = only tell
# notify:                            # optional: problems (and their end) as one line each
#   webhook: https://hooks.example/…  # JSON POST {text, key, kind, subject, state, detail}
#   command: my-notify --stdin        # or a command that gets the same JSON on stdin
