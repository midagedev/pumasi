# Copy to pumasi.yaml, then: make && PUMASI_GITHUB_TOKEN=$(gh auth token) ./dist/pumasi up
url: https://github.com/OWNER/REPO         # repo, org or enterprise
listen: 0.0.0.0:7411                       # where hosts connect (the default); `pumasi invite` prints the line that joins one
# dashboard: 127.0.0.1:7420               # the dashboard, its JSON and /metrics (default: a free loopback port). No login: keep it on loopback

# A class is a kind of runner: runs-on: [self-hosted, pumasi-<name>]. No sizes: pumasi measures
# what each job uses and places its next run by that.
classes:
  - {name: small}
# - {name: e2e,   docker: inside, maxDuration: 2h}                        # the job's own docker daemon
# - {name: cache, mounts: [/srv/ci-cache]}                                # a host path, only on hosts that have it
# - {name: build, driver: native, hosts: [server1]}                       # a process of the host's user, on that host only
# - {name: deploy, reserve: 1}                                            # room other classes may not take
# - {name: shared, driver: native, labels: [self-hosted, Linux, X64, ci-pool]}  # takes over fixed runners' jobs
# - {name: some, labels: [self-hosted, ci-pool], overflow: true}          # takes only what fits now; the rest goes to the fixed runners
# - {name: macos, os: macos}                                              # os: macos | windows, on hosts of that OS
# - {name: heavy, cpus: 8, memory: 24G}                                   # the first estimate for a job never measured (default 2, 4G); not a limit
# - {name: fenced, limit: {memory: 8G}}                                   # a hard limit, for when you want one

# hosts:                                   # optional: `up` runs the invite line there over ssh for you
#   - {ssh: server1}                                                     # lends what it has free, as measured
#   - {ssh: desk1, desktop: true, budget: {cpus: 6, memory: 9G}}          # someone works there: used last, theirs first; budget caps what it lends

# priority:                                # who gets room first while it is short; the first match counts; no running job is stopped
#   - {match: {workflow: "deploy-*.yml"}, level: high}                    # counts as having come 30m earlier
#   - {match: {event: schedule}, level: low}                              # as having come 30m later
# githubApp: {id: Iv23li…, installationId: 12345678, privateKeyFile: ~/.config/pumasi/app.pem}   # instead of PUMASI_GITHUB_TOKEN
# jobsMayReadCredentials: true             # ends the warning about hosts on this machine whose jobs can read the controller's token (docs/guide.md: 보안 모델)
# rerun: 1                                 # rerun a run's failed jobs once after a failure on pumasi's side
# notify: {webhook: https://hooks.example/…}   # or command: my-notify --stdin; problems and their end, one line each
#                                          # the webhook is also given to two hosts: they say so when the controller is gone for 5m (away: 0 = no)
# image: ghcr.io/actions/actions-runner:2.338.2   # the runner version; keep a version tag, not :latest
# watch:                                   # limits on CI itself; each crossed one is an incident (docs/watch.md)
#   limits:
#     - {match: {workflow: ci.yml, job: "e2e*"}, maxJobTime: 20m, maxMemory: 12G}   # the median of the last 5 runs
#     - {match: {workflow: ci.yml}, maxRunTime: 25m}                               # first job's start to last job's end
#     - {match: {workflow: "deploy*.yml"}, maxWait: 5m}                            # waiting for a runner, now
#     - {match: {workflow: nightly.yml, event: schedule}, finishBy: "07:00"}
#   cpuHoursPerDay: 300                    # all jobs together, from midnight
#   slope: 10%                             # a job's median time grew more than this in a week
#   regressions: 20%                       # announce a slower commit this big once (default; off = never)
