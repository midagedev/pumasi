# Copy to pumasi.yaml, then: make && PUMASI_GITHUB_TOKEN=$(gh auth token) ./dist/pumasi up
url: https://github.com/OWNER/REPO   # repo, org or enterprise

classes:                             # a class is a runner size; jobs pick one with
  - {name: linux-s, cpus: 1, memory: 1G}   #   runs-on: [self-hosted, pumasi-linux-s]
  - {name: linux-l, cpus: 2, memory: 3G}

hosts:                               # ssh destinations (aliases from ~/.ssh/config) with Docker
  - ssh: server1
    budget: {cpus: 4, memory: 6G}    # the most pumasi may use on this host
  - ssh: desk1
    desktop: true                    # someone works here: used after the servers
    shell: wsl -e sh -s              # Windows host running WSL (default: sh -s)
    budget: {cpus: 6, memory: 9G}
