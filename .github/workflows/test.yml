name: test
# go vet and go test on the three OSes pumasi's hosts run. The agent's native
# drivers differ per OS and most of their tests only run on their own.
# Started by hand: `gh workflow run test.yml`.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        packages: ["./..."]
        include:
          # Windows is a host, not a place for the controller: the host side only.
          - os: windows-latest
            packages: ./cmd/pumasi ./internal/agent ./internal/cgroup ./internal/join
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ${{ matrix.packages }}
