name: host-paths
# Acceptance for docs/host-paths.md: jobs that use the host's directories.
#   native  two jobs of a native class: the first writes into a host directory
#           and uses the host's docker, the second reads what the first wrote
#   oom     a job that takes more memory than its class
#   mounts  a job of a container class with mounts: [<dir>/rw, <dir>/ro:ro]
#   docker  a job of a container class with docker: inside: its own daemon,
#           and a container of the job that takes more memory than the class
#   compose a job of a docker: inside class that runs a service container and a
#           compose stack (build, healthcheck, depends_on) to its end
#   residue a job of a native class that leaves a directory without write
#           permission and, through the host's docker, files of root
#   plain   a job that needs nothing of the host (any class)
on:
  workflow_dispatch:
    inputs:
      test:
        description: "native | oom | mounts | docker | compose | residue | plain"
        default: "plain"
      class:
        description: "class (scale set pumasi-<class>)"
        default: "build"
      dir:
        description: "mounts: the directory holding rw/ and ro/ (same path on the host and in the container)"
        default: "/tmp/pumasi-test"
      megabytes:
        description: "oom, docker: megabytes the job asks for (residue: 0 = leave no files of root)"
        default: "1500"

jobs:
  write:
    if: inputs.test == 'native'
    runs-on: [self-hosted, "pumasi-${{ inputs.class }}"]
    timeout-minutes: 10
    steps:
      - name: write into a host directory, use the host's docker, leave children behind
        shell: bash
        run: |
          d="$HOME/.cache/pumasi-test/handoff"
          mkdir -p "$d"
          echo "${{ github.run_id }} $RUNNER_NAME" > "$d/note"
          echo "runner=$RUNNER_NAME wrote the note"
          echo "host docker: $(docker version --format '{{.Server.Version}}')"
          docker run --rm --entrypoint sh ghcr.io/actions/actions-runner:2.338.2 -c 'echo "hello from a container of the host docker"'
          # Left behind on purpose; the second hides from the runner's own cleanup.
          sleep 600 &
          RUNNER_TRACKING_ID= nohup setsid sleep 601 > /dev/null 2>&1 &
          perl -e '$x = "x" x (200 << 20); $e = time + 20; 1 while time < $e'
  read:
    if: inputs.test == 'native'
    needs: write
    runs-on: [self-hosted, "pumasi-${{ inputs.class }}"]
    timeout-minutes: 10
    steps:
      - name: read what the job before wrote
        shell: bash
        run: |
          read -r run runner < "$HOME/.cache/pumasi-test/handoff/note"
          echo "runner=$RUNNER_NAME reads a note of run $run written by $runner"
          test "$run" = "${{ github.run_id }}"
          test "$runner" != "$RUNNER_NAME"
  oom:
    if: inputs.test == 'oom'
    runs-on: [self-hosted, "pumasi-${{ inputs.class }}"]
    timeout-minutes: 10
    steps:
      - name: take more memory than the class has
        shell: bash
        run: |
          perl -e '$x = "x" x ($ARGV[0] << 20); sleep 5; print "held it\n"' ${{ inputs.megabytes }}
  mounts:
    if: inputs.test == 'mounts'
    runs-on: [self-hosted, "pumasi-${{ inputs.class }}"]
    timeout-minutes: 10
    steps:
      - name: read and write the mounts at the host's path
        shell: bash
        run: |
          d="${{ inputs.dir }}"
          echo "seed on the host: $(cat "$d/ro/seed")"
          echo "${{ github.run_id }} $RUNNER_NAME" > "$d/rw/from-container"
          cat "$d/rw/from-container"
          if touch "$d/ro/x" 2>/dev/null; then echo "the read-only mount took a write"; exit 1; fi
          echo "read-only mount refused the write"
          # The work directory sits inside the first writable mount: one
          # filesystem behind one mount, so a cache there can be hard-linked.
          echo "workspace: $GITHUB_WORKSPACE"
          ln "$d/rw/from-container" "$GITHUB_WORKSPACE/linked" && echo "hard link from the mount into the workspace: ok ($(stat -c %h "$GITHUB_WORKSPACE/linked") links)"
  docker:
    if: inputs.test == 'docker'
    runs-on: [self-hosted, "pumasi-${{ inputs.class }}"]
    timeout-minutes: 10
    steps:
      - name: the runner's own docker daemon
        shell: bash
        run: |
          echo "daemon $(docker version --format '{{.Server.Version}}'), $(docker ps -aq | wc -l) containers, $(docker images -q | wc -l) images"
          docker run --rm alpine sh -c 'wget -q -O- -T 10 https://api.github.com/zen; echo; echo "network from the job container: ok"'
          docker run -d --name web -p 8080:80 nginx:alpine > /dev/null
          for i in $(seq 50); do curl -fsS -o /dev/null localhost:8080 && break; sleep 0.2; done
          curl -fsS localhost:8080 | grep -o '<title>.*</title>'
          docker run --rm alpine sh -c 'i=0; while [ $i -lt 20000000 ]; do i=$((i+1)); done; echo burned'
      - name: a container of the job takes more memory than the class has
        shell: bash
        run: |
          docker run --rm alpine sh -c 'x=$(head -c ${{ inputs.megabytes }}m /dev/zero | tr "\0" x); echo "held ${#x} bytes"'
  compose:
    if: inputs.test == 'compose'
    runs-on: [self-hosted, "pumasi-${{ inputs.class }}"]
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - name: the job's service container answers
        shell: bash
        run: |
          exec 3<>/dev/tcp/localhost/6379; printf 'PING\r\n' >&3; read -r pong <&3; echo "redis: $pong"
          test "${pong%$'\r'}" = "+PONG"
      - name: a compose stack, to its end
        shell: bash
        run: |
          # The runner image has the docker CLI and buildx, not compose.
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-$(uname -m)"
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
          mkdir -p stack/app && cd stack
          printf 'FROM postgres:16-alpine\nCMD ["psql", "-h", "db", "-U", "postgres", "-tAc", "select 6 * 7"]\n' > app/Dockerfile
          cat > compose.yaml <<'YAML'
          services:
            db:
              image: postgres:16-alpine
              environment: {POSTGRES_PASSWORD: x}
              healthcheck: {test: [CMD, pg_isready, -U, postgres], interval: 1s, retries: 60}
            app:
              build: ./app
              environment: {PGPASSWORD: x}
              depends_on: {db: {condition: service_healthy}}
          YAML
          docker compose up --build --abort-on-container-exit --exit-code-from app 2>&1 | tee up.log
          grep -q '^app-1 *| 42$' up.log
          docker compose down -v
          echo "left in the runner's daemon: $(docker ps -aq | wc -l) containers, $(docker images -q | wc -l) images"
  residue:
    if: inputs.test == 'residue'
    runs-on: [self-hosted, "pumasi-${{ inputs.class }}"]
    timeout-minutes: 10
    steps:
      - name: leave what the runner's user cannot simply delete
        shell: bash
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          case "$GITHUB_WORKSPACE" in "$HOME"/*) echo "the workspace is under the home directory"; exit 1 ;; esac
          mkdir -p ro/deep && echo x > ro/deep/f && chmod -R a-w ro
          if [ "${{ inputs.megabytes }}" != 0 ]; then
            docker run --rm -u 0 -v "$PWD:/w" --entrypoint sh ghcr.io/actions/actions-runner:2.338.2 -c 'mkdir /w/rootdir && echo x > /w/rootdir/f && chmod 700 /w/rootdir'
            ls -ld rootdir
          fi
  plain:
    if: inputs.test == 'plain'
    runs-on: [self-hosted, "pumasi-${{ inputs.class }}"]
    timeout-minutes: 10
    steps:
      - name: nothing of the host
        shell: bash
        run: |
          echo "runner=$RUNNER_NAME"
          perl -e '$e = time + 10; 1 while time < $e'
