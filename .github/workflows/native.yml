name: native
# Acceptance load for native (process) runners, see docs/design.md: short
# jobs on one OS's class, each leaving child processes behind that must be gone
# once the job is over.
on:
  workflow_dispatch:
    inputs:
      class:
        description: "class (scale set pumasi-<class>)"
        default: "macos"
      jobs:
        description: "JSON list, one job per element"
        default: "[1,2,3,4,5]"
      seconds:
        description: "burn duration per job"
        default: "30"
      megabytes:
        description: "megabytes each job holds"
        default: "300"
      parallel:
        description: "jobs at once"
        default: "5"

jobs:
  burn:
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        i: ${{ fromJSON(inputs.jobs) }}
    runs-on: [self-hosted, "pumasi-${{ inputs.class }}"]
    timeout-minutes: 15
    steps:
      - name: burn one cpu, hold memory, leave a child behind (Windows)
        if: runner.os == 'Windows'
        # Not `shell: powershell`: a Windows that was never set up for scripts refuses to load the step's file.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          "runner=$env:RUNNER_NAME os=$env:RUNNER_OS job=${{ matrix.i }} pwd=$PWD"
          # Left behind on purpose: only the end of the runner's Job Object ends it.
          Start-Process ping -ArgumentList '-n','600','127.0.0.1' -WindowStyle Hidden
          $held = @(); $left = ${{ inputs.megabytes }}
          while ($left -gt 0) {
            $n = [Math]::Min($left, 256); $b = New-Object byte[] ($n * 1MB)
            for ($i = 0; $i -lt $b.Length; $i += 4096) { $b[$i] = 1 }
            $held += , $b; $left -= $n
          }
          $end = (Get-Date).AddSeconds(${{ inputs.seconds }}); while ((Get-Date) -lt $end) { }
          "done runner=$env:RUNNER_NAME held=$($held.Count) blocks"
      - name: burn one cpu, hold memory, leave children behind
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "runner=$RUNNER_NAME os=$RUNNER_OS job=${{ matrix.i }} pwd=$PWD"
          # Left behind on purpose. The runner itself kills what still carries
          # RUNNER_TRACKING_ID when the job ends; the second one hides from that
          # and has left the process group, so only pumasi can end it.
          sleep 600 &
          RUNNER_TRACKING_ID= nohup perl -MPOSIX -e 'POSIX::setsid(); sleep 601' > /dev/null 2>&1 &
          perl -e '$x = "x" x ($ARGV[1] << 20); $e = time + $ARGV[0]; 1 while time < $e' ${{ inputs.seconds }} ${{ inputs.megabytes }}
          echo "done runner=$RUNNER_NAME"
