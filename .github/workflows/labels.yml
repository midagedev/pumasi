name: labels
# A job that asks for any labels: what a scale set with a class's labels: takes
# over from fixed runners (docs/design.md).
on:
  workflow_dispatch:
    inputs:
      labels:
        description: "runs-on, as a JSON list"
        default: '["self-hosted", "pumasi-small"]'
      jobs:
        description: "JSON list, one job per element"
        default: "[1]"
      seconds:
        description: "how long each job runs"
        default: "20"
      show:
        description: "environment variables to print (grep -E pattern on NAME=value)"
        default: "^(LANG)="
      mem:
        description: "MiB of memory each job holds while it runs"
        default: "0"
      cache:
        description: "MiB each job writes to a file and reads back (page cache, not memory it needs)"
        default: "0"

jobs:
  hold:
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(inputs.jobs) }}
    runs-on: ${{ fromJSON(inputs.labels) }}
    timeout-minutes: 20
    steps:
      - shell: sh
        run: |
          echo "runner=$RUNNER_NAME job=${{ matrix.i }}"
          env | grep -E '${{ inputs.show }}' | sort || true
          if [ "${{ inputs.cache }}" != 0 ]; then
            dd if=/dev/zero of="$RUNNER_TEMP/cache" bs=1048576 count=${{ inputs.cache }} 2>/dev/null
            cat "$RUNNER_TEMP/cache" > /dev/null
          fi
          if command -v perl > /dev/null; then
            perl -e '$x = "x" x ($ARGV[0] * 1048576); sleep $ARGV[1]' ${{ inputs.mem }} ${{ inputs.seconds }}
          else
            # tail keeps a line until it ends, and this one never does: it holds
            # the bytes for as long as the sleep keeps the pipe open (GNU tail; BSD's takes minutes).
            (head -c $((${{ inputs.mem }} * 1048576)) /dev/zero; sleep ${{ inputs.seconds }}) | tail > /dev/null
          fi
